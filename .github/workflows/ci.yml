name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore BaseRepository.sln

      - name: Build
        run: dotnet build BaseRepository.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test BaseRepository.sln --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

  template-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Regression guard for the dotnet-new template mechanism itself (source substitution,
      # renamed csproj/sln, primaryOutputs restore): scaffold a project from this repo and
      # build+test it exactly as a real consumer of `dotnet new install` would.
      - name: Install this repo as a template
        run: dotnet new install .

      - name: Scaffold a project from it
        run: dotnet new basecrud -n CiSmokeTest -o ${{ runner.temp }}/ci-smoke-test

      - name: Build the scaffolded project
        run: dotnet build ${{ runner.temp }}/ci-smoke-test/CiSmokeTest.sln --configuration Release

      - name: Test the scaffolded project
        run: dotnet test ${{ runner.temp }}/ci-smoke-test/CiSmokeTest.sln --no-build --configuration Release
