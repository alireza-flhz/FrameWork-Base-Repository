name: Publish Template

# Manual or tag-triggered only - this never runs on a regular push/PR. Requires a
# NUGET_API_KEY repository secret (Settings -> Secrets and variables -> Actions) before it can
# actually publish; without one, the push step fails with a clear auth error rather than
# publishing anything. Bump <PackageVersion> in template-pack/BaseRepository.Template.csproj
# before tagging a release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack the template
        run: dotnet pack template-pack/BaseRepository.Template.csproj --configuration Release --output ./nupkg

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "./nupkg/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
