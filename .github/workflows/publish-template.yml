name: Publish Template

# Manual or tag-triggered only - this never runs on a regular push/PR. Publishes via NuGet.org
# Trusted Publishing (OIDC, no stored secret) - requires a Trusted Publishing policy on
# nuget.org scoped to this repo + this workflow file (see nuget.org/account/trusted-publishing).
# Bump <PackageVersion> in template-pack/BaseRepository.Template.csproj before tagging a release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack the template
        run: dotnet pack template-pack/BaseRepository.Template.csproj --configuration Release --output ./nupkg

      - name: NuGet login (OIDC -> temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: alireza-flhz

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "./nupkg/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
